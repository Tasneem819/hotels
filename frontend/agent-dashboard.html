<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agent Dashboard</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f6f8;
    }

    header {
      background-color: #003580;
      color: #fff;
      padding: 1rem 2rem;
      text-align: center;
    }

    nav {
      background-color: #004a99;
      padding: 0.5rem 2rem;
      text-align: right;
    }

    nav a {
      color: #fff;
      margin-left: 1rem;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      max-width: 700px;
      margin: 2rem auto;
      background: #fff;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
    }

    h2 {
      text-align: center;
      color: #003580;
    }

    label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
      color: #333;
    }

    input, textarea {
      width: 100%;
      padding: 0.7rem;
      margin-top: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      margin-top: 1.5rem;
      padding: 0.8rem 1.2rem;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover {
      background-color: #0056b3;
    }

    footer {
      margin-top: 2rem;
      padding: 1rem;
      background: #e0e0e0;
      text-align: center;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Agent Dashboard</h1>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="logout.html">Logout</a>
  </nav>

  <div class="container">
    <h2>Update Hotel Details</h2>

    <form id="hotelUpdateForm">
      <label for="hotelName">Hotel Name:</label>
      <input type="text" id="hotelName" name="hotelName" required>

      <label for="location">Location:</label>
      <input type="text" id="location" name="location" required>

      <label for="rooms">Available Rooms:</label>
      <input type="number" id="rooms" name="rooms" required>

      <label for="price">Room Price (per night):</label>
      <input type="number" id="price" name="price" required>

      <label for="description">Description:</label>
      <textarea id="description" name="description" rows="4" required></textarea>

      <button type="submit">Update Details</button>
    </form>
  </div>

  <footer>
    &copy; 2025 Hotel Booking Portal | Agent Access Panel
  </footer>

  <script>
    document.getElementById("hotelUpdateForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const data = {
        hotelName: document.getElementById("hotelName").value,
        location: document.getElementById("location").value,
        rooms: document.getElementById("rooms").value,
        price: document.getElementById("price").value,
        description: document.getElementById("description").value,
      };

      fetch("http://localhost:3000/api/agent/update-hotel", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      })
      .then(res => res.json())
      .then(response => {
        if (response.success) {
          alert("Hotel details updated successfully!");
        } else {
          alert("Failed to update hotel details.");
        }
      })
      .catch(err => {
        console.error(err);
        alert("Server error");
      });
    });
  </script>

</body>
</html>
