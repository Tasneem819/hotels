<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Explore Our Rooms</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #007BFF;
      padding: 20px;
      text-align: center;
      color: white;
    }

    h1 {
      margin: 0;
    }

    .gallery-container {
      padding: 40px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .room-card {
      background-color: white;
      width: 280px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s ease;
    }

    .room-card:hover {
      transform: scale(1.03);
    }

    .room-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .room-card .details {
      padding: 15px;
      text-align: center;
    }

    .room-card h3 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .room-card p {
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>

  <header>
    <h1>Explore Our Rooms</h1>
  </header>

  <div class="gallery-container">
    <div class="room-card">
      <img src="images/room1.jpg" alt="Deluxe Room" />
      <div class="details">
        <h3>Deluxe Room</h3>
        <p>Spacious room with luxurious amenities.</p>
      </div>
    </div>

    <div class="room-card">
      <img src="images/room2.jpg" alt="Executive Suite" />
      <div class="details">
        <h3>Executive Suite</h3>
        <p>Ideal for business stays and comfort.</p>
      </div>
    </div>

    <div class="room-card">
      <img src="images/room3.jpg" alt="Family Room" />
      <div class="details">
        <h3>Family Room</h3>
        <p>Perfect for family vacations and group stays.</p>
      </div>
    </div>

    <!-- Add more rooms as needed -->
  </div>

</body>
</html>
